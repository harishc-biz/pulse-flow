trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pulse-infra/terraform/**

variables:
  serviceConnection: 'azure-svc-conn'
  workingDirectory: '$(System.DefaultWorkingDirectory)/pulse-infra/terraform'
  terraformVersion: '1.12.1'

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================================================
# DEV STAGES
# =========================================================
- stage: TerraformPlan_Dev
  displayName: 'Dev: Plan'
  jobs:
  - job: Plan
    steps:
    - checkout: self
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '$(terraformVersion)'
    - task: TerraformTaskV4@4
      displayName: 'Init Dev'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'pulse-rg'
        backendAzureRmStorageAccountName: 'pulseterraformstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'dev.tfstate' # Dedicated Dev State
    - task: TerraformTaskV4@4
      displayName: 'Plan Dev'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'
        commandOptions: '-var-file="pulse-dev.tfvars" -out=dev.tfplan'
    - publish: '$(workingDirectory)/dev.tfplan'
      artifact: dev-plan

- stage: TerraformApply_Dev
  displayName: 'Dev: Apply'
  dependsOn: TerraformPlan_Dev
  condition: succeeded()
  jobs:
  - deployment: ApplyDev
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: dev-plan
          - task: TerraformTaskV4@4
            displayName: 'Apply Dev'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              commandOptions: '$(Pipeline.Workspace)/dev-plan/dev.tfplan'
              environmentServiceNameAzureRM: '$(serviceConnection)'

# =========================================================
# PROD STAGES
# =========================================================
- stage: TerraformPlan_Prod
  displayName: 'Prod: Plan'
  dependsOn: TerraformApply_Dev # Only plan Prod if Dev apply succeeded
  jobs:
  - job: Plan
    steps:
    - checkout: self
    - task: TerraformTaskV4@4
      displayName: 'Init Prod'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'pulse-rg'
        backendAzureRmStorageAccountName: 'pulseterraformstate'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'prod.tfstate'
    - task: TerraformTaskV4@4
      displayName: 'Plan Prod'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'
        commandOptions: '-var-file="pulse-prod.tfvars" -out=prod.tfplan'
    - publish: '$(workingDirectory)/prod.tfplan'
      artifact: prod-plan

- stage: TerraformApply_Prod
  displayName: 'Prod: Apply'
  dependsOn: TerraformPlan_Prod
  jobs:
  - deployment: ApplyProd
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: prod-plan
          - task: TerraformTaskV4@4
            displayName: 'Apply Prod'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              commandOptions: '$(Pipeline.Workspace)/prod-plan/prod.tfplan'
              environmentServiceNameAzureRM: '$(serviceConnection)'