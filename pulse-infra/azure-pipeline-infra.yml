trigger:
  branches:
    include:
      - main

  paths:
    include:
      - pulse-infra/terraform/**

variables:
  serviceConnection: 'azure-connection'
  workingDirectory: '$(System.DefaultWorkingDirectory)/pulse-infra/terraform'
  terraformVersion: '1.8.5'

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================================================
# Terraform PLAN
# =========================================================
- stage: TerraformPlan
  displayName: 'Terraform Plan'

  jobs:
  - job: Plan
    displayName: 'Run Terraform Plan'

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(serviceConnection)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: '$(serviceConnection)'
        commandOptions: '-out=tfplan.tfplan -input=false'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(workingDirectory)/tfplan.tfplan'
        artifact: 'tfplan'
        publishLocation: 'pipeline'

# =========================================================
# Terraform APPLY
# =========================================================
- stage: TerraformApply
  displayName: 'Terraform Apply'

  dependsOn: TerraformPlan

  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: Apply
    displayName: 'Apply Terraform Changes'

    environment: 'dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'tfplan'
              path: '$(workingDirectory)'

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(serviceConnection)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(serviceConnection)'
              commandOptions: '-input=false tfplan.tfplan'