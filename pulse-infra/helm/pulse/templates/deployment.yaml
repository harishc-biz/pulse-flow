apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  # --- THE SELECTOR BLOCK (This was likely missing or broken) ---
  selector:
    matchLabels:
      app: pulse-api
  # --------------------------------------------------------------
  template:
    metadata:
      labels:
        app: pulse-api
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: ServiceBusConnectionString
              valueFrom:
                secretKeyRef:
                  name: pulse-api-secrets
                  key: connectionstring
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "pulse.fullname" . }}