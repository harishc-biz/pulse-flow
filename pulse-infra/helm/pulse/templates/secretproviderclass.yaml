apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pulse-api
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azure.identityClientId | quote }}
    keyvaultName: {{ .Values.azure.keyvaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: ServiceBusConnectionString
          objectType: secret
          alias: ServiceBusConnectionString
  # This section creates a real K8s secret from the Key Vault data
  secretObjects:
    - secretName: pulse-api-secrets
      type: Opaque
      data:
        - objectName: ServiceBusConnectionString
          key: connectionstring