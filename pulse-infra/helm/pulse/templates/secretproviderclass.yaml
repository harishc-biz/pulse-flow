apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "pulse.fullname" . }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azure.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.azure.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: ServiceBusConnectionString
          objectType: secret
          alias: ServiceBusConnectionString
    tenantId: {{ .Values.azure.tenantId | quote }}
  secretObjects: # This creates a K8s secret from the KV secret
    - secretName: work-api-bus-secret
      type: Opaque
      data:
        - objectName: ServiceBusConnectionString
          key: connectionstring