trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pulse-app/**

variables:
  # Connection Names from your ADO Service Connections
  dockerRegistryServiceConnection: 'acr-connection' # Replace with your ACR connection name
  kubernetesServiceConnection: 'aks-connection'     # Replace with your AKS connection name
  
  # Resource Details
  imageRepository: 'pulse-work-api'
  containerRegistry: 'pulseflowacr.azurecr.io'      # Replace with your ACR Login Server
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: "Build and Push Image"
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: "Build & Push to ACR"
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: "Deploy to AKS"
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production' # Optional: Creates an Environment in ADO for tracking
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmDeploy@0
            displayName: "Helm Upgrade/Install"
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              namespace: 'default'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: './charts/work-tracker' # Path to your Helm chart folder
              releaseName: 'pulse-work-api'
              install: true
              # This line overrides the image tag in your values.yaml with the unique build ID
              overrideValues: 'image.tag=$(tag)'