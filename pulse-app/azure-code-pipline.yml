trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pulse-app/**

variables:
  # Connection Names from your ADO Service Connections
  dockerRegistryServiceConnection: 'acr-connect' 
  kubernetesServiceConnection: 'aks-connect'     
  
  # Resource Details
  imageRepository: 'pulseapp'
  containerRegistry: 'flowacr.azurecr.io'      
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: "Build and Push Image"
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: "Build & Push ACR"
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest


- stage: Deploy
  displayName: "Deploy to AKS"
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmDeploy@0
            displayName: "Helm Deploy"
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscription: 'azure-connection'
              azureResourceGroup: 'pulse-rg'
              kubernetesCluster: 'pulse_aks'
              namespace: 'pulse-dev'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: './pulse-infra/helm/pulse'
              releaseName: 'pulse-api'
              overrideValues: 'image.tag=$(tag)'