trigger:
  branches:
    include:
      - main
  paths:
    include:
      - pulse-app/**

variables:
  # Connection Names from your ADO Service Connections
  dockerRegistryServiceConnection: 'acr-connect' 
  kubernetesServiceConnection: 'aks-connect'     
  
  # Resource Details
  imageRepository: 'pulseapp'
  containerRegistry: 'flowacr.azurecr.io'      
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: "Build and Push Image"
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: "Build & Push ACR"
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
